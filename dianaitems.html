<meta charset="UTF-8">

<style>
  :root {
    --gold: #c9aa71;
    --muted: #9da7b3;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background: url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Diana_77.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #e6edf3;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(circle at top, rgba(200,120,40,0.22), transparent 60%),
      rgba(10,12,18,0.84);
    z-index: -1;
  }

  header {
    width: 100%;
    background: rgba(13,17,23,0.9);
    border-bottom: 2px solid var(--gold);
    padding: 20px 0;
    font-size: 26px;
    font-weight: bold;
    color: var(--gold);
    text-align: center;
    text-transform: uppercase;
    z-index: 10;
    position: relative;
  }

  .return-wrap {
    width: 100%;
    text-align: center;
    margin: 16px 0;
    position: relative;
    z-index: 10;
  }

  .return-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    background: linear-gradient(135deg, var(--gold), #e0c77b);
    color: #000;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
    transition: filter 0.2s;
  }

  .return-btn:hover {
    filter: brightness(1.1);
  }

  .return-btn::before {
    content: "←";
  }

  .container {
    width: 85%;
    max-width: 900px;
    margin: 0 auto 40px;
    position: relative;
    z-index: 1;
  }

  .card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 20px;
    border-radius: 16px;
    text-align: left;
    margin-bottom: 20px;
    box-sizing: border-box;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }

  .card label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #cfe1ee;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type=number], select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(15,22,35,0.9);
    color: white;
    font-size: 15px;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 20px;
    width: 100%;
    box-sizing: border-box;
  }

  input[type=number]:focus, select:focus {
    border-color: var(--gold);
    outline: none;
  }

  .top-row {
    display: flex;
    gap: 15px;
    margin-bottom: 0;
    flex-wrap: wrap;
  }
  .top-row .top-item {
    flex: 1 1 30%;
    min-width: 120px;
  }

  .ability-card { margin-bottom: 20px; }
  .ability-row { display: flex; flex-direction: column; margin-bottom: 14px; }
  .ability-row:last-child { margin-bottom: 0; }
  .ability-row .first-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .ability-row .first-line span { font-weight: bold; color: #cfe1ee; font-size: 14px; }
  .ability-row select.rank-select { width: 70px; margin-bottom: 0; padding: 6px; }
  .ability-row select.uses-select { width: 100%; margin-top: 0; }

  button#calculate-btn {
    margin: 20px auto 30px;
    display: block;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    background: linear-gradient(135deg, var(--gold), #e0c77b);
    color: #000;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: filter 0.2s;
  }
  button#calculate-btn:hover {
    filter: brightness(1.1);
  }

  .table-card {
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    padding: 14px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    word-wrap: break-word;
  }
  th { 
    color: var(--gold); 
    font-size: 15px; 
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  td { color: #e6edf3; font-size: 14px; text-align: center; }
  
  #total-damage {
    font-size: 16px;
    font-weight: bold;
    color: var(--gold);
  }

  footer { 
    text-align: center; 
    padding: 16px; 
    color: var(--muted); 
    font-size: 13px; 
    margin-top: auto;
  }

  .items-grid {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .items-grid .custom-select-wrapper { flex: 1 1 30%; min-width: 140px; margin-bottom: 0; }
  
  #item-stats p {
    margin: 6px 0;
    color: var(--muted);
  }
  #item-stats p span { color: white; font-weight: bold; }

  /* Custom Item Select Dropdown Styling */
  .custom-select-wrapper {
    position: relative;
    user-select: none;
    box-sizing: border-box;
  }

  .custom-select {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(15,22,35,0.9);
    color: white;
    font-size: 14px;
    cursor: pointer;
    box-sizing: border-box;
    min-height: 40px;
  }

  .custom-select:hover, .custom-select.open {
    border-color: var(--gold);
  }

  .custom-select .selected-value {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .custom-select img.item-icon,
  .custom-option img.item-icon {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    object-fit: contain;
    background: rgba(0,0,0,0.2);
    flex-shrink: 0;
  }

  .custom-select::after {
    content: "";
    width: 20px;
    height: 20px;
    background-image: url("data:image/svg+xml,%3Csvg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 20px;
    flex-shrink: 0;
    margin-left: 5px;
  }

  .custom-options {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: rgba(13,17,23,0.98);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    max-height: 600px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }

  .custom-select-wrapper.open .custom-options {
    display: block;
  }

  .custom-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 14px;
    color: #e6edf3;
    transition: background 0.15s;
  }

  .custom-option:hover {
    background: rgba(201, 170, 113, 0.15);
    color: var(--gold);
  }

  @media(max-width:700px){
    .top-row .top-item { flex: 1 1 100%; }
    .ability-row .first-line { flex-direction: row; justify-content: space-between; }
    .ability-row select.uses-select { width: 100%; margin-top: 0; }
    .container {
      width: 94%;
      margin: 0 auto 20px;
    }
    .items-grid .custom-select-wrapper { flex: 1 1 100%; }
  }
</style>
</head>

function populateItems() {
  for(let i=1; i<=6; i++){
    const hiddenInput = document.getElementById(`item-${i}`);
    const wrapper = document.getElementById(`wrapper-item-${i}`);
    const selectBox = wrapper.querySelector('.custom-select');
    const optionsContainer = wrapper.querySelector('.custom-options');
    
    optionsContainer.innerHTML = "";
    
    // Empty option
    const emptyOpt = document.createElement("div");
    emptyOpt.className = "custom-option";
    emptyOpt.innerHTML = `<span style="color:var(--muted)">— None —</span>`;
    emptyOpt.addEventListener("click", () => {
      hiddenInput.value = "";
      selectBox.querySelector('.selected-value').innerHTML = "";
      wrapper.classList.remove("open");
      updateItemStats();
    });
    optionsContainer.appendChild(emptyOpt);

    AP_ITEMS.forEach((it, idx) => {
      const opt = document.createElement("div");
      opt.className = "custom-option";
      const iconUrl = it.customIcon || `https://ddragon.leagueoflegends.com/cdn/${PATCH_VERSION}/img/item/${it.id}.png`;
      opt.innerHTML = `<img src="${iconUrl}" class="item-icon" alt="${it.name}"><span>${it.name}</span>`;
      
      opt.addEventListener("click", () => {
        hiddenInput.value = idx;
        selectBox.querySelector('.selected-value').innerHTML = `<img src="${iconUrl}" class="item-icon" alt="${it.name}"><span>${it.name}</span>`;
        wrapper.classList.remove("open");
        updateItemStats();
      });
      optionsContainer.appendChild(opt);
    });

    // Default Doran's Ring on item 1
    if(i === 1){
      const doransIndex = AP_ITEMS.findIndex(item => item.name === "Doran's Ring");
      if(doransIndex !== -1){
        hiddenInput.value = doransIndex;
        const it = AP_ITEMS[doransIndex];
        const iconUrl = it.customIcon || `https://ddragon.leagueoflegends.com/cdn/${PATCH_VERSION}/img/item/${it.id}.png`;
        selectBox.querySelector('.selected-value').innerHTML = `<img src="${iconUrl}" class="item-icon" alt="${it.name}"><span>${it.name}</span>`;
      }
    }

    // Toggle dropdown
    selectBox.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".custom-select-wrapper").forEach(w => {
        if(w !== wrapper) w.classList.remove("open");
      });
      wrapper.classList.toggle("open");
    });
  }

  // Close dropdowns when clicking outside
  document.addEventListener("click", () => {
    document.querySelectorAll(".custom-select-wrapper").forEach(w => w.classList.remove("open"));
  });
}

function populateRanksAndUses(){
  const abilityRanks = { "q-rank":5, "w-rank":5, "e-rank":5, "r-rank":3 };
  Object.keys(abilityRanks).forEach(id=>{
    const max = abilityRanks[id];
    const sel = document.getElementById(id);
    sel.innerHTML="";
    for(let i=1;i<=max;i++){
      const o = document.createElement("option");
      o.value=i;
      o.textContent=i;
      sel.appendChild(o);
    }
    sel.value=1;
  });

  document.querySelectorAll(".uses-select").forEach(sel=>{
    sel.innerHTML="";
    for(let i=0;i<=10;i++){
      const o = document.createElement("option");
      o.value=i;
      o.textContent=i;
      sel.appendChild(o);
    }
    sel.value=0;
  });
}

function populateLevels() {
  const lvl=document.getElementById("diana-level");
  for(let i=1;i<=18;i++){
    const o=document.createElement("option");
    o.value=i;
    o.textContent=i;
    lvl.appendChild(o);
  }
  lvl.value=1;
}

function getItemStats(){
  let totalAP=0, flatPen=0, percPen=0;
  let hasDeathcap=false;

  for(let i=1;i<=6;i++){
    const idx=document.getElementById(`item-${i}`).value;
    if(idx==="") continue;
    const item=AP_ITEMS[parseInt(idx)];

    if(item.name==="Rabadon's Deathcap"){
      hasDeathcap=true;
      continue;
    }

    totalAP+=item.ap;
    flatPen+=item.flatPen;
    // Stack percentage penetration multiplicatively or additively depending on standard convention (here combined or stacked)
    percPen = 1 - (1 - percPen) * (1 - item.percPen);
  }

  if(hasDeathcap){
    totalAP = (totalAP + 130) * 1.30;
  }

  return {totalAP:Math.round(totalAP), flatPen, percPen};
}

function updateItemStats(){
  const {totalAP, flatPen, percPen}=getItemStats();
  document.getElementById("total-ap").textContent=totalAP;
  document.getElementById("total-flat-pen").textContent=flatPen;
  document.getElementById("total-perc-pen").textContent=Math.round(percPen*100)+"%";
}

function getPassiveBase(level){ return Math.round(20 + (220-20)*(level-1)/17); }
function getAutoAttackBase(level){ return Math.round(57 + (108-57)*(level-1)/17); }

const Q_BASE=[0,70,105,140,175,210], Q_RATIO=0.7;
const W_BASE=[0,60,96,132,168,204], W_RATIO=0.54;
const E_BASE=[0,50,70,90,110,130], E_RATIO=0.6;
const R_BASE=[0,200,300,400], R_RATIO=0.6;
const DIANA_BASE_AD = 57;
const DIANA_AD_GROWTH = 3.5;

function getBaseAD(level) {
  return DIANA_BASE_AD + DIANA_AD_GROWTH * (level - 1);
}

function calcMagicDamage(base, ratio, ap, mr, count, flatPen, percPen){
  if(base===0 || count===0) return 0;
  let raw=(base+ratio*ap)*count;
  let effectiveMR=mr-flatPen;
  if(effectiveMR<0) effectiveMR=0;
  effectiveMR*=1-percPen;
  return Math.round(raw*100/(100+effectiveMR));
}

function calcPhysicalDamage(base, count, armor){
  if(base===0 || count===0) return 0;
  return Math.round(base * count * 100 / (100 + armor));
}

function calcBonusItemDamage(totalAP, mr, flatPen, percPen, level) {
  let bonusMagic = 0;
  for (let i = 1; i <= 6; i++) {
    const idx = document.getElementById(`item-${i}`).value;
    if (idx === "") continue;
    const item = AP_ITEMS[parseInt(idx)];

    if(item.bonus==="stormsurge"){
      let raw = 125 + 0.10 * totalAP;
      let effectiveMR = mr - flatPen;
      if (effectiveMR < 0) effectiveMR = 0;
      effectiveMR *= 1 - percPen;
      bonusMagic += Math.round(raw * 100 / (100 + effectiveMR));
    }

    if(item.bonus==="lichbane"){
      let aaBase = getAutoAttackBase(level);
      let raw = 0.75*aaBase + 0.45*totalAP;
      let effectiveMR = mr - flatPen;
      if (effectiveMR < 0) effectiveMR = 0;
      effectiveMR *= 1 - percPen;
      bonusMagic += Math.round(raw * 100 / (100 + effectiveMR));
    }

    if (item.bonus === "duskdawn") {
      const baseAD = getBaseAD(level);
      let raw = 0.75 * baseAD + 0.10 * totalAP;
      let effectiveMR = mr - flatPen;
      if (effectiveMR < 0) effectiveMR = 0;
      effectiveMR *= 1 - percPen;
      bonusMagic += Math.round(raw * 100 / (100 + effectiveMR));
    }

    if(item.bonus==="nashor"){
      let aaRaw = 15 + 0.15*totalAP;
      let effectiveMR = mr - flatPen;
      if (effectiveMR < 0) effectiveMR = 0;
      effectiveMR *= 1 - percPen;
      bonusMagic += Math.round(aaRaw * 100 / (100 + effectiveMR));
    }
  }
  return bonusMagic;
}

function calculateCombo(){
  const level=parseInt(document.getElementById("diana-level").value);
  const mr=parseFloat(document.getElementById("enemy-mr").value)||30;
  const armor=parseFloat(document.getElementById("enemy-armor").value)||30;

  const {totalAP,flatPen,percPen}=getItemStats();
  updateItemStats();

  const abilities=[
    {name:"Auto Attack", base:getAutoAttackBase(level), ratio:0, count:parseInt(document.getElementById("aa-count").value)||0, type:"Physical"},
    {name:"Passive", base:getPassiveBase(level), ratio:0.5, count:parseInt(document.getElementById("passive-count").value)||0, type:"Magic"},
    {name:"Q", base:Q_BASE[parseInt(document.getElementById("q-rank").value)], ratio:Q_RATIO, count:parseInt(document.getElementById("q-count").value)||0, type:"Magic"},
    {name:"W", base:W_BASE[parseInt(document.getElementById("w-rank").value)], ratio:W_RATIO, count:parseInt(document.getElementById("w-count").value)||0, type:"Magic"},
    {name:"E", base:E_BASE[parseInt(document.getElementById("e-rank").value)], ratio:E_RATIO, count:parseInt(document.getElementById("e-count").value)||0, type:"Magic"},
    {name:"R", base:R_BASE[parseInt(document.getElementById("r-rank").value)], ratio:R_RATIO, count:parseInt(document.getElementById("r-count").value)||0, type:"Magic"}
  ];

  const rows=document.querySelectorAll("#damage-table tr");
  let totalMagic=0;
  let totalPhysical=0;

  abilities.forEach((ab,i)=>{
    let dmg;
    if(ab.type==="Magic"){
      dmg = calcMagicDamage(ab.base, ab.ratio, totalAP, mr, ab.count, flatPen, percPen);
      totalMagic += dmg;
    } else {
      dmg = calcPhysicalDamage(ab.base, ab.count, armor);
      totalPhysical += dmg;
    }
    rows[i].cells[1].textContent=dmg || "—";
  });

  const bonus = calcBonusItemDamage(totalAP, mr, flatPen, percPen, level);
  document.getElementById("bonus-items-dmg").textContent = bonus || "—";
  totalMagic += bonus;

  const total = totalMagic + totalPhysical;
  document.getElementById("total-damage").textContent = total;
  document.getElementById("total-damage-type").textContent = `Magic: ${totalMagic} • Physical: ${totalPhysical}`;
}

document.addEventListener("DOMContentLoaded",()=>{
  populateItems();
  populateLevels();
  populateRanksAndUses();
  updateItemStats();
  
  document.getElementById("calculate-btn").addEventListener("click", calculateCombo);
});
</script>
