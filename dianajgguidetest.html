<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diana Jungle Guide</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/NFO4uNP.png">
    <!-- Include the same CSS styles as your Mid Guide for consistency -->
    <style>
        /* (Use the exact same CSS as your Diana Mid Guide provided) */
    </style>
</head>
<body>

<header>Diana Jungle Guide</header>

<div class="back-wrap">
    <a href="membershub.html" class="back-button">Back to Members Hub</a>
</div>

<!-- Navigation (Same as Mid Guide) -->
<button class="nav-trigger" id="mobileTrigger" onclick="toggleMobileMenu()">Select a Section</button>
<div class="nav-menu-mobile" id="mobileMenu">
    <!-- List your sections here, ensure data-section matches Firestore field names -->
    <a data-section="intro">Intro</a>
    <a data-section="runes">Runes</a>
    <a data-section="build">Build</a>
    <a data-section="summoners">Summoner spells</a>
    <a data-section="abilities">Abilities</a>
    <a data-section="combos">Combos</a>
    <a data-section="level1">Level 1</a>
    <a data-section="pathing">Pathing</a>
    <a data-section="matchups">Hardest matchups</a>
    <a data-section="teamfighting">Team fighting</a>
    <a data-section="closing">Closing out the game</a>
    <a data-section="proscons">Pros & Cons</a>
    <a data-section="outro">Outro</a>
</div>

<div class="nav-wrapper">
    <div class="nav-menu" id="navMenu">
        <!-- Replicate links here for desktop -->
    </div>
</div>

<div class="main">
    <div id="content" class="card">
        <h2>Loading Guide...</h2>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      
    const firebaseConfig = { /* Use your existing config */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let cachedData = null;

    async function initializeGuide() {
        const docRef = doc(db, "premiumContent", "diana_jungle_guide");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            cachedData = docSnap.data();
            showSection('intro');
        }
    }

    function showSection(sectionKey) {
        const contentBox = document.getElementById('content');
        const actualKey = cachedData ? Object.keys(cachedData).find(k => k.toLowerCase() === sectionKey.toLowerCase()) : null;
        if (actualKey) contentBox.innerHTML = cachedData[actualKey];
        document.getElementById('mobileMenu').style.display = 'none';
    }

    document.querySelectorAll('[data-section]').forEach(link => {
        link.addEventListener('click', (e) => showSection(e.target.getAttribute('data-section')));
    });

    onAuthStateChanged(auth, (user) => {
        if (user) initializeGuide();
        else window.location.replace("index.html");
    });
</script>
</body>
</html>
