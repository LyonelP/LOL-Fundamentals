<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LoL Fundamentals – Tierlist</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">

  <style>
  :root{
    --gold:#c9aa71;
    --bg:#0a0f14;
    --card:#161b22;
    --muted:#8b949e;
  }

  body {
    margin: 0;
    font-family: "Beaufort for LOL", Arial, Helvetica, sans-serif;
    background: #0a0f14;
    color: #e6edf3;
    line-height: 1.6;
    text-align: center;
  }

  header {
    background: linear-gradient(90deg, #0a0f14, #1b2838);
    border-bottom: 2px solid var(--gold);
    padding: 14px 20px;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .back-button {
    display: inline-block;
    margin: 20px auto 8px auto;
    padding: 10px 20px;
    background: linear-gradient(135deg, #c9aa71, #e0c77b);
    color: #000;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 0 10px rgba(201, 170, 113, 0.5);
  }

  .back-button::before {
    content: "← ";
  }

  .back-button:hover {
    background: linear-gradient(135deg, #e6c97f, #f0d88b);
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
  }

  #roleSelect {
    display: block;
    margin: 20px auto 40px auto;
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: #161b22;
    color: #e6edf3;
    box-shadow: 0 0 8px rgba(201, 170, 113, 0.2);
  }

  #championCards {
    max-width: 1100px;
    margin: 0 auto 60px auto;
    padding: 0 12px;
  }

  .tier-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 38px;
  }

  .tier-divider {
    text-align: center;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 14px;
    color: var(--gold);
  }

  .tier-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
  }

  /* Compact card style */
  .card {
    background: #161b22;
    border: 2px solid var(--gold);
    border-radius: 10px;
    width: 136px;
    padding: 8px;
    text-align: center;
    color: #e6edf3;
    transition: transform 0.22s, box-shadow 0.22s;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card img {
    width: 84px;
    height: 84px;
    border-radius: 8px;
    object-fit: cover;
    display: block;
    margin: 0 auto 6px auto;
    background: linear-gradient(180deg, #0f1722, #12161c);
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(201, 170, 113, 0.35);
  }

  .champ-name {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 2px;
  }

  .champ-rank {
    font-size: 11px;
    color: var(--gold);
    font-weight: bold;
    margin-bottom: 4px;
  }

  .champ-desc {
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.25;
    text-align: left;
    width: 100%;
    border-top: 1px solid rgba(201, 170, 113, 0.2);
    padding-top: 4px;
    margin-top: auto;
  }

  footer {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 14px;
    background: var(--bg);
    border-top: 1px solid #1f2937;
  }

  footer a {
    color: var(--gold);
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 600px) {
    .card {
      width: 110px;
      padding: 6px;
    }
    .card img {
      width: 68px;
      height: 68px;
    }
    .champ-name {
      font-size: 11px;
    }
    .champ-desc {
      font-size: 9.5px;
    }
  }
</style>
</head>
<body>

<header>Solo Queue Tierlist</header>

<a href="https://lolfundamentals.com" class="back-button">Back to LoL Fundamentals</a>

<select id="roleSelect" aria-label="Select role">
  <option value="Top">Top</option>
  <option value="Jungle">Jungle</option>
  <option value="Mid">Mid</option>
  <option value="ADC">ADC</option>
  <option value="Support">Support</option>
</select>

<div id="championCards" aria-live="polite"></div>

<footer>
  © 2025 LoL Fundamentals · Contact:
  <a href="mailto:arcsecond@lolfundamentals.com">arcsecond@lolfundamentals.com</a>
</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRtIJeggpJ6cjGJt0OOds4OZDuHMMUxHCWzMiU1Bd4gJ8EvfZMXPE9p0X1K3yyeZs7bpFyQZHhHpnsu/pub?output=csv';

const IMG_NAME_OVERRIDES = {
  "Bel'Veth": "Belveth",
  "Cho'Gath": "Chogath",
  "Kha'Zix": "Khazix",
  "Kai'Sa": "Kaisa",
  "LeBlanc": "Leblanc",
  "Wukong": "MonkeyKing",
  "Nunu & Willump": "Nunu",
  "Dr. Mundo": "DrMundo",
  "Aurelion Sol": "AurelionSol",
  "Jarvan IV": "JarvanIV",
  "Kog'Maw": "KogMaw",
  "Master Yi": "MasterYi",
  "Miss Fortune": "MissFortune",
  "Rek'Sai": "RekSai",
  "Tahm Kench": "TahmKench",
  "Twisted Fate": "TwistedFate",
  "Xin Zhao": "XinZhao",
  "Lee Sin": "LeeSin",
  "Vel'Koz": "Velkoz",
  "Bel'Beth": "Belveth",
  "Renata Glasc": "Renata",
  "Mel": "Mel",
  "Zac": "Zac",
  "Zaahen": "Zaahen"
};

function getImageName(champName) {
  if (!champName) return null;
  if (IMG_NAME_OVERRIDES[champName]) return IMG_NAME_OVERRIDES[champName];
  const normalized = champName.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return normalized.replace(/[\s'’&\.\-]/g, '');
}

const PLACEHOLDER =
  'data:image/svg+xml;charset=UTF-8,' +
  encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="100%" height="100%" fill="#0f1722"/><text x="50%" y="50%" fill="#c9aa71" font-size="20" font-family="Arial" dominant-baseline="middle" text-anchor="middle">No Image</text></svg>`
  );

let PATCH = "16.13.1";

async function getLatestPatch() {
  try {
    const versions = await fetch(
      "https://ddragon.leagueoflegends.com/api/versions.json"
    ).then(r => r.json());

    if (Array.isArray(versions) && versions.length) {
      PATCH = versions[0];
    }
  } catch (e) {
    console.warn("Couldn't fetch latest patch, using fallback:", PATCH);
  }
}

/* CSV parser capable of reading quoted description text */
function parseCSVLine(line) {
  const values = [];
  let currentVal = '';
  let inQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      values.push(currentVal.trim());
      currentVal = '';
    } else {
      currentVal += char;
    }
  }
  values.push(currentVal.trim());
  return values;
}

async function loadCSV(url) {
  const txt = await fetch(url).then((r) => r.text());
  const lines = txt.trim().split(/\r?\n/);
  if (!lines.length) return {};

  const header = parseCSVLine(lines[0]);
  const champions = {};

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = parseCSVLine(lines[i]);
    const champRaw = (cols[0] || '').trim();
    if (!champRaw) continue;

    champions[champRaw] = {};
    for (let j = 1; j < header.length && j < cols.length; j++) {
      const colName = header[j].trim();
      champions[champRaw][colName] = (cols[j] || '').trim();
    }
  }
  return champions;
}

function renderTierGroups(champRanks, role) {
  const container = document.getElementById('championCards');
  container.innerHTML = '';
  const rankOrder = ['OP','S','A','B','C','D'];

  rankOrder.forEach((rank) => {
    const champsInRank = Object.keys(champRanks).filter(name => {
      const val = champRanks[name]?.[role]?.trim();
      return val && val.toUpperCase() === rank && val.toUpperCase() !== 'X';
    });

    if (champsInRank.length === 0) return;

    const tierGroup = document.createElement('div');
    tierGroup.className = 'tier-group';

    const divider = document.createElement('div');
    divider.className = 'tier-divider';
    divider.textContent = rank;
    tierGroup.appendChild(divider);

    const tierCards = document.createElement('div');
    tierCards.className = 'tier-cards';

    champsInRank.forEach(champName => {
      const imgName = getImageName(champName);
      const imgURL = imgName
        ? `https://ddragon.leagueoflegends.com/cdn/${PATCH}/img/champion/${imgName}.png`
        : PLACEHOLDER;

      const descKey = `${role}_Desc`;
      const description = champRanks[champName]?.[descKey] || champRanks[champName]?.['Desc'] || '';

      const card = document.createElement('div');
      card.className = 'card';
      
      card.innerHTML = `
        <img src="${imgURL}" alt="${champName}" onerror="this.onerror=null;this.src='${PLACEHOLDER}';">
        <div class="champ-name">${champName}</div>
        <div class="champ-rank">${rank} Tier</div>
        ${description ? `<div class="champ-desc">${description}</div>` : ''}
      `;
      
      tierCards.appendChild(card);
    });

    tierGroup.appendChild(tierCards);
    container.appendChild(tierGroup);
  });
}

(async function init() {
  try {
    await getLatestPatch();
    const champRanks = await loadCSV(CSV_URL);
    const roleSelect = document.getElementById('roleSelect');

    roleSelect.addEventListener('change', () =>
      renderTierGroups(champRanks, roleSelect.value)
    );

    renderTierGroups(champRanks, roleSelect.value || 'Top');
  } catch (err) {
    console.error('Failed to load CSV', err);
    document.getElementById('championCards').innerHTML =
      '<p style="color:#f88">Failed to load tierlist — check your CSV link.</p>';
  }
})();
</script>
</body>
</html>
