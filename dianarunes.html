  <meta charset="utf-8" />

  <title>Diana Rune Calculator</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://i.imgur.com/NFO4uNP.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://i.imgur.com/NFO4uNP.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/NFO4uNP.png">
  <style>
    :root {
      --gold: #c9aa71;
      --muted: #9da7b3;
    }

    /* Reset */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Diana_76.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at top, rgba(200,120,40,0.22), transparent 60%),
        rgba(10,12,18,0.84);
      z-index: -1;
    }

    /* Header */
    header {
      width: 100%;
      background: rgba(13,17,23,0.9);
      border-bottom: 2px solid var(--gold);
      padding: 20px 0;
      font-size: 26px;
      font-weight: bold;
      color: var(--gold);
      text-align: center;
      text-transform: uppercase;
      z-index: 10;
      position: relative;
    }

    /* Back button */
    .back-wrap {
      width: 100%;
      text-align: center;
      margin: 16px 0;
      position: relative;
      z-index: 10;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--gold), #e0c77b);
      color: #000;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: filter 0.2s;
    }

    .back-button:hover {
      filter: brightness(1.1);
    }

    .back-button::before {
      content: "←";
    }

    .container {
      width: 85%;
      max-width: 900px;
      margin: 0 auto 40px;
      position: relative;
      z-index: 1;
    }

    .section-title {
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin: 20px 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 16px;
      text-align: left;
      margin-bottom: 20px;
      box-sizing: border-box;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .card label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
      color: #cfe1ee;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px;
      background: rgba(15, 22, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 14px;
      box-sizing: border-box;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 20px;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--gold);
      outline: none;
    }

    .calculate-btn {
      margin: 20px auto 30px;
      display: block;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--gold), #e0c77b);
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .calculate-btn:hover {
      filter: brightness(1.1);
    }

    .table-card {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    th {
      padding: 14px 8px;
      font-size: 15px;
      color: var(--gold);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 8px;
      color: #e6edf3;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      word-wrap: break-word;
    }

    /* Rune cell layout with icon */
    .rune-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rune-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(0,0,0,0.5);
    }

    /* Custom Select Styles for Rune Dropdowns with Icons */
    .custom-select-wrapper {
      position: relative;
      user-select: none;
      margin-bottom: 14px;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 10px;
      background: rgba(15, 22, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-image: url("data:image/svg+xml,%3Csvg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 20px;
      padding-right: 35px;
    }

    .custom-select-trigger:hover {
      border-color: var(--gold);
    }

    .custom-select-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: rgba(13, 17, 23, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      z-index: 100;
      max-height: 220px;
      overflow-y: auto;
      display: none;
    }

    .custom-select-dropdown.open {
      display: block;
    }

    .custom-select-option {
      padding: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .custom-select-option:hover {
      background: rgba(201, 170, 113, 0.15);
    }

    .custom-select-option.selected {
      background: rgba(201, 170, 113, 0.25);
      color: var(--gold);
    }

    /* Footer */
    footer {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: auto;
    }

    @media (max-width: 700px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .container {
        width: 94%;
        margin: 0 auto 20px;
      }
      .card {
        padding: 16px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>

<header>Diana Rune Calculator</header>

<div class="back-wrap">

<div class="container">
  <div class="grid-2">
    <div id="mobile-left-column">
      <div class="section-title">Diana’s Level</div>
      <div class="card">
        <label>Level</label>
        <select id="diana-level"></select>
      </div>

      <div class="section-title">Primary Runes</div>
      <div class="card">
        <label>Primary Path</label>
        <select id="primary-path">
          <option value="domination">Domination</option>
          <option value="sorcery">Sorcery</option>
          <option value="precision">Precision</option>
          <option value="resolve">Resolve</option>
          <option value="inspiration">Inspiration</option>
        </select>

        <label>Slot 1 (Keystone)</label>
        <select id="primary-slot-1"></select>
        <label>Slot 2</label>
        <select id="primary-slot-2"></select>
        <label>Slot 3</label>
        <select id="primary-slot-3"></select>
        <label>Slot 4</label>
        <select id="primary-slot-4"></select>
      </div>
    </div>

    <div id="mobile-right-column">
      <div class="section-title">Enemy Stats</div>
      <div class="card">
        <label>HP</label>
        <input type="number" value="600" id="enemy-hp">
        <label>Armor</label>
        <input type="number" value="30" id="enemy-armor">
        <label>MR</label>
        <input type="number" value="30" id="enemy-mr">
      </div>

      <div class="section-title">Secondary Runes</div>
      <div class="card">
        <label>Secondary Path</label>
        <select id="secondary-path">
          <option value="domination">Domination</option>
          <option value="sorcery" selected>Sorcery</option>
          <option value="precision">Precision</option>
          <option value="resolve">Resolve</option>
          <option value="inspiration">Inspiration</option>
        </select>

        <label>Slot 1</label>
        <select id="secondary-slot-1"></select>
        <label>Slot 2</label>
        <select id="secondary-slot-2"></select>
      </div>
    </div>
  </div>

  <button class="calculate-btn" id="calculate-btn">Calculate Damage</button>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Rune</th>
          <th>Estimated Damage</th>
          <th>Damage Type</th>
        </tr>
      </thead>
      <tbody id="rune-damage-table">
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>

        <tr><td><strong>Total</strong></td><td>—</td><td>—</td></tr>
      </tbody>
    </table>
  </div>
</div>

  "Jack of All Trades": "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/perk-images/styles/inspiration/jackofalltrades/jackofalltrades.png"
};

const PRIMARY_PATHS = {
  domination:{ slot1:["Electrocute","Hail of Blades","Dark Harvest"], slot2:["Cheap Shot","Taste of Blood","Sudden Impact"], slot3:["Sixth Sense","Grisly Mementos","Deep Ward"], slot4:["Treasure Hunter","Relentless Hunter","Ultimate Hunter"] },
  sorcery:{ slot1:["Aery","Comet","Stormraider's Surge","Deathfire Touch"], slot2:["Axiom Arcanist","Manaflow Band","Nimbus Cloak"], slot3:["Transcendence","Celerity","Absolute Focus"], slot4:["Scorch","Waterwalking","Gathering Storm"] },
  precision:{ slot1:["Press the Attack","Lethal Tempo","Fleet Footwork"], slot2:["Absorb Life","Triumph","Presence of Mind"], slot3:["Legend: Alacrity","Legend: Tenacity","Legend: Bloodline"], slot4:["Coup De Grace","Cut Down","Last Stand"] },
  resolve:{
    slot1:["Grasp of the Undying","Aftershock","Guardian"],
    slot2:["Demolish","Font of Life","Shield Bash"],
    slot3:["Conditioning","Second Wind","Bone Plating"],
    slot4:["Overgrowth","Revitalize","Unflinching"]
  },
  inspiration:{ slot1:["Glacial Augment","Unsealed Spellbook","First Strike"], slot2:["Hextech Flashtraption","Magical Footwear","Cash Back"], slot3:["Triple Tonic","Time Warp Tonic","Biscuit Delivery"], slot4:["Cosmic Insight","Approach Velocity","Jack of All Trades"] }
};

const PATH_ROWS = {
  domination: [
    ["Electrocute","Hail of Blades","Dark Harvest"],
    ["Cheap Shot","Taste of Blood","Sudden Impact"],
    ["Sixth Sense","Grisly Memories","Deep Ward"],
    ["Treasure Hunter","Relentless Hunter","Ultimate Hunter"]
  ],
  sorcery: [
    ["Aery","Comet","Stormraider's Surge","Deathfire Touch"],
    ["Axiom Arcanist","Manaflow Band","Nimbus Cloak"],
    ["Transcendence","Celerity","Absolute Focus"],
    ["Scorch","Waterwalking","Gathering Storm"]
  ],
  precision: [
    ["Press the Attack","Lethal Tempo","Fleet Footwork"],
    ["Absorb Life","Triumph","Presence of Mind"],
    ["Legend: Alacrity","Legend: Tenacity","Legend: Bloodline"],
    ["Coup De Grace","Cut Down","Last Stand"]
  ],
  resolve: [
    ["Grasp of the Undying","Aftershock","Guardian"],
    ["Demolish","Font of Life","Shield Bash"],
    ["Conditioning","Second Wind","Bone Plating"],
    ["Overgrowth","Revitalize","Unflinching"]
  ],
  inspiration: [
    ["Glacial Augment","Unsealed Spellbook","First Strike"],
    ["Hextech Flashtraption","Magical Footwear","Future's Market"],
    ["Minion Dematerializer","Biscuit Delivery","Cosmic Insight"],
    ["Approach Velocity","Time Warp Tonic","Jack of All Trades"]
  ]
};

function getRowIndex(path, runeName) {
  const rows = PATH_ROWS[path] || [];
  for (let r = 0; r < rows.length; r++) {
    if (rows[r].includes(runeName)) return r;
  }
  return -1;
}

function getSecondaryList(path) {
  const rows = PATH_ROWS[path] || [];
  let list = [];
  for (let r = 1; r < rows.length; r++) {
    list.push(...rows[r]);
  }
  return list;
}

function makeCustomSelect(selectEl) {
  let wrapper = selectEl.nextElementSibling;
  if (wrapper && wrapper.classList.contains('custom-select-wrapper')) {
    wrapper.remove();
  }

  selectEl.style.display = 'none';

  wrapper = document.createElement('div');
  wrapper.className = 'custom-select-wrapper';

  const trigger = document.createElement('div');
  trigger.className = 'custom-select-trigger';
  
  const dropdown = document.createElement('div');
  dropdown.className = 'custom-select-dropdown';

  function updateTrigger() {
    const val = selectEl.value;
    const iconUrl = RUNE_ICONS[val] || '';
    trigger.innerHTML = `
      <div class="rune-cell">
        ${iconUrl ? `<img src="${iconUrl}" class="rune-icon" alt="" onerror="this.style.display='none'">` : ''}
        <span>${val || 'Select Rune'}</span>
      </div>
    `;
  }

  Array.from(selectEl.options).forEach(opt => {
    const optionDiv = document.createElement('div');
    const val = opt.value;
    const iconUrl = RUNE_ICONS[val] || '';
    optionDiv.className = 'custom-select-option' + (val === selectEl.value ? ' selected' : '');
    optionDiv.innerHTML = `
      <div class="rune-cell">
        ${iconUrl ? `<img src="${iconUrl}" class="rune-icon" alt="" onerror="this.style.display='none'">` : ''}
        <span>${val}</span>
      </div>
    `;
    optionDiv.addEventListener('click', (e) => {
      e.stopPropagation();
      selectEl.value = val;
      selectEl.dispatchEvent(new Event('change'));
      wrapper.querySelectorAll('.custom-select-option').forEach(o => o.classList.remove('selected'));
      optionDiv.classList.add('selected');
      updateTrigger();
      dropdown.classList.remove('open');
    });
    dropdown.appendChild(optionDiv);
  });

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-select-dropdown').forEach(d => {
      if (d !== dropdown) d.classList.remove('open');
    });
    dropdown.classList.toggle('open');
  });

  wrapper.appendChild(trigger);
  wrapper.appendChild(dropdown);
  selectEl.parentNode.insertBefore(wrapper, selectEl.nextSibling);
  updateTrigger();
}

function populateSelect(el, options, keepVal){
  const prev = keepVal ? el.value : null;
  el.innerHTML="";
  options.forEach(opt=>{
    const o=document.createElement("option");
    o.value=o.textContent=opt;
    el.appendChild(o);
  });
  if(keepVal && prev){
    for(let i=0;i<el.options.length;i++){
      if(el.options[i].value===prev){ el.selectedIndex=i; break; }
    }
  }
  if(el.id && el.id.includes('slot')){
    makeCustomSelect(el);
  }
}

function initLevel(){
  const lvl=document.getElementById("diana-level");
  for(let i=1;i<=18;i++){
    const o=document.createElement("option"); o.value=i; o.textContent=i;
    lvl.appendChild(o);
  }
  lvl.value=1;
}

function populatePrimary(path){
  const data=PRIMARY_PATHS[path];
  populateSelect(document.getElementById("primary-slot-1"),data.slot1);
  populateSelect(document.getElementById("primary-slot-2"),data.slot2);
  populateSelect(document.getElementById("primary-slot-3"),data.slot3);
  populateSelect(document.getElementById("primary-slot-4"),data.slot4);
}

function populateSecondary(path, emptySelection = false){
  const data = getSecondaryList(path);
  const slot1El = document.getElementById("secondary-slot-1");
  const slot2El = document.getElementById("secondary-slot-2");

  populateSelect(slot1El, data);
  populateSelect(slot2El, data);

  if (emptySelection) {
    slot1El.value = "";
    slot2El.value = "";
  } else if(path === "sorcery") {
    slot1El.value = "Manaflow Band";
    slot2El.value = "Transcendence";
  } else if(data.length >= 2) {
    slot1El.value = data[0];
    for(let i=1; i<data.length; i++) {
      if(getRowIndex(path, data[i]) !== getRowIndex(path, data[0])) {
        slot2El.value = data[i];
        break;
      }
    }
  }
  makeCustomSelect(slot1El);
  makeCustomSelect(slot2El);
}

function validateSecondarySlots(changedSlotId) {
  const path = document.getElementById("secondary-path").value;
  const slot1El = document.getElementById("secondary-slot-1");
  const slot2El = document.getElementById("secondary-slot-2");
  
  const row1 = getRowIndex(path, slot1El.value);
  const row2 = getRowIndex(path, slot2El.value);
  
  if (row1 !== -1 && row1 === row2) {
    const data = getSecondaryList(path);
    for (let item of data) {
      if (getRowIndex(path, item) !== row1) {
        if (changedSlotId === 'secondary-slot-1') {
          slot2El.value = item;
        } else {
          slot1El.value = item;
        }
        break;
      }
    }
    makeCustomSelect(slot1El);
    makeCustomSelect(slot2El);
  }
}

function scaleDamage(min,max,level){ return Math.round(min + (max-min)*(level-1)/17); }

function getDianaHP(level){ return Math.round(740 + (2674 - 740) * (level - 1) / 17); }

function calcDamage(rune,level,ap,armor,mr){
  if(!rune || rune==="Null" || rune==="—") return {damage:0,type:""};
  let dmg=0, type="Magic";
  const hp = getDianaHP(level);

  if(rune==="Grasp of the Undying"){
    dmg=Math.round(0.035*hp);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Shield Bash"){
    dmg = Math.round(30 + (78-30)*(level-1)/17);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Cheap Shot"){
    dmg=scaleDamage(10,45,level);
    type="True";
  } else if(rune==="Sudden Impact"){
    dmg=scaleDamage(20,80,level);
    type="True";
  } else if(rune==="Scorch"){
    dmg=scaleDamage(20,40,level);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Comet"){
    dmg=scaleDamage(30,130,level) + Math.round(0.1*ap);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Deathfire Touch"){
    const baseTick = 1.5 + (6.53 - 1.5) * (level - 1) / 17;
    const bonusAD = 0; 
    const tickDmg = baseTick + (0.035 * bonusAD) + (0.0125 * ap);
    let totalBurn = tickDmg * 8;
    totalBurn *= 1.75; 
    dmg = Math.round(totalBurn);
    dmg = Math.round(dmg * 100 / (100 + mr));
    type = "Magic";
  } else if(rune==="Press the Attack"){
    dmg = scaleDamage(40, 174.12, level);
    dmg = Math.round(dmg * 100 / (100 + armor));
    type = "Physical";
  } else {
    const meta=RUNE_DAMAGE[rune];
    if(!meta) return {damage:0,type:""};
    dmg=scaleDamage(meta.min,meta.max,level)+Math.round((meta.ratio||0)*ap);
    if(meta.type==="Magic") dmg=Math.round(dmg*100/(100+mr));
    type=meta.type;
  }
  return {damage:dmg,type:type};
}

function calculateDamage(){
  const level = parseInt(document.getElementById("diana-level").value, 10);
  const enemyArmor = parseFloat(document.getElementById("enemy-armor").value)||30;
  const enemyMR = parseFloat(document.getElementById("enemy-mr").value)||30;
  const ap = 18;

  const slots = [
    document.getElementById("primary-slot-1").value,
    document.getElementById("primary-slot-2").value,
    document.getElementById("primary-slot-3").value,
    document.getElementById("primary-slot-4").value,
    document.getElementById("secondary-slot-1").value,
    document.getElementById("secondary-slot-2").value
  ];

  const tbody=document.getElementById("rune-damage-table");
  const rows = tbody.querySelectorAll("tr");

  let totalMagic = 0;
  let totalPhysical = 0;
  let totalTrue = 0;

  for(let i=0;i<6;i++){
    const rune = slots[i]||"—";
    const {damage,type} = calcDamage(rune,level,ap,enemyArmor,enemyMR);

    if(type==="Magic") totalMagic += damage;
    else if(type==="Physical") totalPhysical += damage;
    else if(type==="True") totalTrue += damage;

    let runeHtml = rune;
    if(rune !== "—" && rune !== "Null" && RUNE_ICONS[rune]) {
      runeHtml = `<div class="rune-cell"><img src="${RUNE_ICONS[rune]}" alt="${rune}" class="rune-icon" onerror="this.style.display='none'"><span>${rune}</span></div>`;
    }

    rows[i].innerHTML = `<td>${runeHtml}</td><td>${damage||"—"}</td><td>${type||"—"}</td>`;
  }

  const total = totalMagic + totalPhysical + totalTrue;

  rows[6].innerHTML = `
    <td><strong>Total</strong></td>
    <td><strong>${total}</strong></td>
    <td>Magic: ${totalMagic} • Physical: ${totalPhysical} • True: ${totalTrue}</td>
  `;
}

function enforcePaths(){
  const primary = document.getElementById("primary-path").value;
  const secondary = document.getElementById("secondary-path");
  
  for(let i=0; i<secondary.options.length; i++){
    if(secondary.options[i].value === primary){
      secondary.options[i].disabled = true;
    } else {
      secondary.options[i].disabled = false;
    }
  }

  if(secondary.value === primary){
    for(let i=0; i<secondary.options.length; i++){
      if(!secondary.options[i].disabled){
        secondary.selectedIndex = i;
        break;
      }
    }
    populateSecondary(secondary.value, true);
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  initLevel();
  populatePrimary(document.getElementById("primary-path").value);
  populateSecondary("sorcery");
  enforcePaths();

  ['primary-slot-1', 'primary-slot-2', 'primary-slot-3', 'primary-slot-4', 'secondary-slot-1', 'secondary-slot-2'].forEach(id => {
    const el = document.getElementById(id);
    if(el) makeCustomSelect(el);
  });

  document.addEventListener("click", () => {
    document.querySelectorAll('.custom-select-dropdown').forEach(d => d.classList.remove('open'));
  });

  document.getElementById("primary-path").addEventListener("change",e=>{
    populatePrimary(e.target.value); 
    enforcePaths();
  });
  
  document.getElementById("secondary-path").addEventListener("change",e=>{
    populateSecondary(e.target.value); 
    enforcePaths();
  });

  document.getElementById("secondary-slot-1").addEventListener("change", () => validateSecondarySlots('secondary-slot-1'));
  document.getElementById("secondary-slot-2").addEventListener("change", () => validateSecondarySlots('secondary-slot-2'));

  document.getElementById("calculate-btn").addEventListener("click", calculateDamage);
  calculateDamage();
});
</script>
