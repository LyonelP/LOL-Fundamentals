<!DOCTYPE html>
<html lang="en">
<head>
 
<script>
  if (localStorage.getItem('lolfundamentals_logged_in') !== 'true') {

</script>
 
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diana Rune Calculator</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://i.imgur.com/NFO4uNP.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://i.imgur.com/NFO4uNP.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/NFO4uNP.png">
  <style>
    :root {
      --gold: #c9aa71;
      --muted: #9da7b3;
    }

    /* Reset */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Body and background (Eternal Dragon Diana splash art, skin #42) */
    body {
      background: url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/Diana_76.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at top, rgba(200,120,40,0.22), transparent 60%),
        rgba(10,12,18,0.84);
      z-index: -1;
    }

    /* Header */
    header {
      width: 100%;
      background: rgba(13,17,23,0.9);
      border-bottom: 2px solid var(--gold);
      padding: 20px 0;
      font-size: 26px;
      font-weight: bold;
      color: var(--gold);
      text-align: center;
      text-transform: uppercase;
      z-index: 10;
      position: relative;
    }

    /* Back button */
    .back-wrap {
      width: 100%;
      text-align: center;
      margin: 16px 0;
      position: relative;
      z-index: 10;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: linear-gradient(135deg, var(--gold), #e0c77b);
      color: #000;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: filter 0.2s;
    }

    .back-button:hover {
      filter: brightness(1.1);
    }

    .back-button::before {
      content: "←";
    }

    .container {
      width: 85%;
      max-width: 900px;
      margin: 0 auto 40px;
      position: relative;
      z-index: 1;
    }

    .section-title {
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin: 20px 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 16px;
      text-align: left;
      margin-bottom: 20px;
      box-sizing: border-box;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .card label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
      color: #cfe1ee;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 10px;
      background: rgba(15, 22, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 14px;
      box-sizing: border-box;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 20px;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--gold);
      outline: none;
    }

    .calculate-btn {
      margin: 20px auto 30px;
      display: block;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(135deg, var(--gold), #e0c77b);
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .calculate-btn:hover {
      filter: brightness(1.1);
    }

    .table-card {
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }

    th {
      padding: 14px 8px;
      font-size: 15px;
      color: var(--gold);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 8px;
      color: #e6edf3;
      font-size: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      word-wrap: break-word;
    }

    /* Footer */
    footer {
      padding: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: auto;
    }

    @media (max-width: 700px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .container {
        width: 94%;
        margin: 0 auto 20px;
      }
      .card {
        padding: 16px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>
<body>

<header>Diana Rune Calculator</header>

<div class="back-wrap">
  <a href="membershub.html" class="back-button">Back to Members Hub</a>
</div>

<div class="container">
  <div class="grid-2">
    <div id="mobile-left-column">
      <div class="section-title">Diana’s Level</div>
      <div class="card">
        <label>Level</label>
        <select id="diana-level"></select>
      </div>

      <div class="section-title">Primary Runes</div>
      <div class="card">
        <label>Primary Path</label>
        <select id="primary-path">
          <option value="domination">Domination</option>
          <option value="sorcery">Sorcery</option>
          <option value="precision">Precision</option>
          <option value="resolve">Resolve</option>
          <option value="inspiration">Inspiration</option>
        </select>

        <label>Slot 1 (Keystone)</label>
        <select id="primary-slot-1"></select>
        <label>Slot 2</label>
        <select id="primary-slot-2"></select>
        <label>Slot 3</label>
        <select id="primary-slot-3"></select>
        <label>Slot 4</label>
        <select id="primary-slot-4"></select>
      </div>
    </div>

    <div id="mobile-right-column">
      <div class="section-title">Enemy Stats</div>
      <div class="card">
        <label>HP</label>
        <input type="number" value="600" id="enemy-hp">
        <label>Armor</label>
        <input type="number" value="30" id="enemy-armor">
        <label>MR</label>
        <input type="number" value="30" id="enemy-mr">
      </div>

      <div class="section-title">Secondary Runes</div>
      <div class="card">
        <label>Secondary Path (pick a different path)</label>
        <select id="secondary-path">
          <option value="domination">Domination</option>
          <option value="sorcery">Sorcery</option>
          <option value="precision">Precision</option>
          <option value="resolve">Resolve</option>
          <option value="inspiration">Inspiration</option>
        </select>

        <label>Slot 1</label>
        <select id="secondary-slot-1"></select>
        <label>Slot 2</label>
        <select id="secondary-slot-2"></select>
      </div>
    </div>
  </div>

  <button class="calculate-btn" id="calculate-btn">Calculate Damage</button>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Rune</th>
          <th>Estimated Damage</th>
          <th>Damage Type</th>
        </tr>
      </thead>
      <tbody id="rune-damage-table">
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td>—</td><td>—</td><td>—</td></tr>
        <tr><td><strong>Total</strong></td><td>—</td><td>—</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>© 2026 LoL Fundamentals</footer>

<script>

  const menu = document.getElementById('mobileMenu');
}
</script>

<script>
const RUNE_DAMAGE = {
  "Electrocute": { type:"Magic", min:70, max:240, ratio:0.05 },
  "Cheap Shot": { type:"True", min:10, max:45, ratio:0 },
  "Sudden Impact": { type:"True", min:20, max:80, ratio:0 },
  "Grasp of the Undying": { type:"Magic" },
  "Shield Bash": { type:"Magic" },
  "Scorch": { type:"Magic", min:20, max:40 },
  "Comet": { type:"Magic", min:30, max:130, ratio:0.1 }
};

const PRIMARY_PATHS = {
  domination:{ slot1:["Electrocute","Hail of Blades","Dark Harvest"], slot2:["Cheap Shot","Taste of Blood","Sudden Impact"], slot3:["Sixth Sense","Grisly Memories","Null"], slot4:["Treasure Hunter","Relentless Hunter","Ultimate Hunter"] },
  sorcery:{ slot1:["Aery","Comet","Phase Rush"], slot2:["Nimbus Cloak","Transcendence","Celerity"], slot3:["Scorch","Waterwalking","Null"], slot4:["Null","Null","Gathering Storm"] },
  precision:{ slot1:["Press the Attack","Lethal Tempo","Fleet Footwork"], slot2:["Presence of Mind","Triumph","Coup de Grace"], slot3:["Legend: Alacrity","Legend: Tenacity","Cut Down"], slot4:["Last Stand","Null","Null"] },
  resolve:{
    slot1:["Grasp of the Undying","Aftershock","Guardian"],
    slot2:["Demolish","Font of Life","Shield Bash"],
    slot3:["Conditioning","Second Wind","Bone Plating"],
    slot4:["Overgrowth","Revitalize","Unflinching"]
  },
  inspiration:{ slot1:["Glacial Augment","Unsealed Spellbook","First Strike"], slot2:["Hextech Flashtraption","Magical Footwear","Future's Market"], slot3:["Minion Dematerializer","Biscuit Delivery","Cosmic Insight"], slot4:["Approach Velocity","Time Warp Tonic","Null"] }
};

const SECONDARY_NONKEY = {
  domination:["Cheap Shot","Taste of Blood","Sudden Impact","Sixth Sense","Grisly Memories","Treasure Hunter","Relentless Hunter","Ultimate Hunter","Hail of Blades"],
  sorcery:["Manaflow Band","Transcendence","Celerity","Scorch","Waterwalking","Gathering Storm"],
  precision:["Presence of Mind","Triumph","Coup de Grace","Legend: Alacrity","Legend: Tenacity","Cut Down","Last Stand"],
  resolve:["Demolish","Font of Life","Shield Bash","Conditioning","Second Wind","Bone Plating","Overgrowth","Revitalize","Unflinching"],
  inspiration:["Hextech Flashtraption","Magical Footwear","Future's Market","Minion Dematerializer","Biscuit Delivery","Cosmic Insight","Approach Velocity","Time Warp Tonic","Unsealed Spellbook"]
};

function populateSelect(el, options, keepVal){
  const prev = keepVal ? el.value : null;
  el.innerHTML="";
  options.forEach(opt=>{
    const o=document.createElement("option");
    o.value=o.textContent=opt;
    el.appendChild(o);
  });
  if(keepVal && prev){
    for(let i=0;i<el.options.length;i++){
      if(el.options[i].value===prev){ el.selectedIndex=i; break; }
    }
  }
}

function initLevel(){
  const lvl=document.getElementById("diana-level");
  for(let i=1;i<=18;i++){
    const o=document.createElement("option"); o.value=i; o.textContent=i;
    lvl.appendChild(o);
  }
  lvl.value=1;
}

function populatePrimary(path){
  const data=PRIMARY_PATHS[path];
  populateSelect(document.getElementById("primary-slot-1"),data.slot1);
  populateSelect(document.getElementById("primary-slot-2"),data.slot2);
  populateSelect(document.getElementById("primary-slot-3"),data.slot3);
  populateSelect(document.getElementById("primary-slot-4"),data.slot4);
}

function populateSecondary(path){
  const data=SECONDARY_NONKEY[path]||[];
  populateSelect(document.getElementById("secondary-slot-1"),data);
  populateSelect(document.getElementById("secondary-slot-2"),data);
  if(path==="sorcery"){
    document.getElementById("secondary-slot-1").value="Manaflow Band";
    document.getElementById("secondary-slot-2").value="Transcendence";
  }
}

function scaleDamage(min,max,level){ return Math.round(min + (max-min)*(level-1)/17); }

function getDianaHP(level){ return Math.round(740 + (2674 - 740) * (level - 1) / 17); }

function calcDamage(rune,level,ap,mr){
  if(!rune || rune==="Null" || rune==="—") return {damage:0,type:""};
  let dmg=0, type="Magic";
  const hp = getDianaHP(level);

  if(rune==="Grasp of the Undying"){
    dmg=Math.round(0.035*hp);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Shield Bash"){
    dmg = Math.round(30 + (78-30)*(level-1)/17);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Cheap Shot"){
    dmg=scaleDamage(10,45,level);
    type="True";
  } else if(rune==="Sudden Impact"){
    dmg=scaleDamage(20,80,level);
    type="True";
  } else if(rune==="Scorch"){
    dmg=scaleDamage(20,40,level);
    dmg=Math.round(dmg*100/(100+mr));
  } else if(rune==="Comet"){
    dmg=scaleDamage(30,130,level) + Math.round(0.1*ap);
    dmg=Math.round(dmg*100/(100+mr));
  } else {
    const meta=RUNE_DAMAGE[rune];
    if(!meta) return {damage:0,type:""};
    dmg=scaleDamage(meta.min,meta.max,level)+Math.round((meta.ratio||0)*ap);
    if(meta.type==="Magic") dmg=Math.round(dmg*100/(100+mr));
    type=meta.type;
  }
  return {damage:dmg,type:type};
}

function calculateDamage(){
  const level = parseInt(document.getElementById("diana-level").value, 10);
  const enemyMR = parseFloat(document.getElementById("enemy-mr").value)||30;
  const ap = 18;

  const slots = [
    document.getElementById("primary-slot-1").value,
    document.getElementById("primary-slot-2").value,
    document.getElementById("primary-slot-3").value,
    document.getElementById("primary-slot-4").value,
    document.getElementById("secondary-slot-1").value,
    document.getElementById("secondary-slot-2").value
  ];

  const tbody=document.getElementById("rune-damage-table");
  const rows = tbody.querySelectorAll("tr");

  let totalMagic = 0;
  let totalPhysical = 0;
  let totalTrue = 0;

  for(let i=0;i<6;i++){
    const rune = slots[i]||"—";
    const {damage,type} = calcDamage(rune,level,ap,enemyMR);

    if(type==="Magic") totalMagic += damage;
    else if(type==="Physical") totalPhysical += damage;
    else if(type==="True") totalTrue += damage;

    rows[i].innerHTML = `<td>${rune}</td><td>${damage||"—"}</td><td>${type||"—"}</td>`;
  }

  const total = totalMagic + totalPhysical + totalTrue;

  rows[6].innerHTML = `
    <td><strong>Total</strong></td>
    <td><strong>${total}</strong></td>
    <td>Magic: ${totalMagic} • Physical: ${totalPhysical} • True: ${totalTrue}</td>
  `;
}

function enforcePaths(){
  const primary=document.getElementById("primary-path").value;
  const secondary=document.getElementById("secondary-path");
  for(let i=0;i<secondary.options.length;i++){
    secondary.options[i].disabled=(secondary.options[i].value===primary);
  }
  if(secondary.value===primary){
    for(let i=0;i<secondary.options.length;i++){
      if(!secondary.options[i].disabled){ secondary.selectedIndex=i; break; }
    }
  }
}

document.addEventListener("DOMContentLoaded",()=>{
  initLevel();
  populatePrimary(document.getElementById("primary-path").value);
  populateSecondary("sorcery");
  enforcePaths();

  document.getElementById("primary-path").addEventListener("change",e=>{
    populatePrimary(e.target.value); enforcePaths(); calculateDamage();
  });
  document.getElementById("secondary-path").addEventListener("change",e=>{
    populateSecondary(e.target.value); enforcePaths(); calculateDamage();
  });

  document.getElementById("calculate-btn").addEventListener("click",calculateDamage);

  document.querySelectorAll("select").forEach(el=>{
    el.addEventListener("change", calculateDamage);
  });
});
</script>

</body>
</html>
